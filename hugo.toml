baseURL = "https://junupark.xyz/"
languageCode = "en-us"
title = "Junu Park"
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
disableKinds = ["taxonomy", "term"]

[pagination]
  pagerSize = 10

[permalinks]
  blog = "/blog/:slug/"

[minify]
  disableXML = true
  minifyOutput = true

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
    [markup.goldmark.renderer]
      unsafe = true
      hardWraps = true
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false

[params]
  env = "production"
  description = "Junu Park — projects and essays."
  author = "Junu Park"
  reading_words_per_minute = 200

  [[params.socialIcons]]
    name = "GitHub"
    url = "https://github.com/junuxyz"
  [[params.socialIcons]]
    name = "Email"
    url = "mailto:jpjunior211@gmail.com"

[menu]
  [[menu.main]]
    identifier = "home"
    name = "Home"
    url = "/"
    weight = 10
  [[menu.main]]
    identifier = "projects"
    name = "Projects"
    url = "/projects/"
    weight = 20
  [[menu.main]]
    identifier = "blog"
    name = "Essays"
    url = "/blog/"
    weight = 30
